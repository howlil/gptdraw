name: Verify
on:
  push:
    branches: [master]
  pull_request:
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Verify extension artifacts
        run: |
          test -s dist/manifest.json
          test -s dist/content.js
          test -s dist/content.css
          test -s dist/background.js
          ! grep -R 'OPENAI_API_KEY\|/v1/responses\|127.0.0.1:8787' dist
